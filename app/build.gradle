plugins { id 'com.android.application' }
android {
    namespace 'com.displayoff.test'
    compileSdk 35
    defaultConfig {
        applicationId 'com.displayoff.test'
        minSdk 30
        targetSdk 34
        versionCode 1
        versionName '0.1.0-test'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    packaging { resources { excludes += ['META-INF/versions/9/OSGI-INF/MANIFEST.MF','META-INF/DEPENDENCIES','META-INF/LICENSE','META-INF/LICENSE.txt','META-INF/NOTICE','META-INF/NOTICE.txt'] } }
}
dependencies {
    implementation 'com.github.MuntashirAkon:libadb-android:3.1.1'
    implementation 'org.conscrypt:conscrypt-android:2.5.3'
    implementation 'org.bouncycastle:bcpkix-jdk15to18:1.81'
}
